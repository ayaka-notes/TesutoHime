# Dev gateway — single port on :8080, plain HTTP.
#
# Mirrors the production routing layout (docker/nginx/nginx.conf) but
# without TLS. Internal services are still reachable on their direct
# ports (5080 / 5300 / 7880 / 9000) for direct hits during development;
# this gateway just gives one URL that touches the whole stack the same
# way production will.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 75;
    client_max_body_size 256m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream web_upstream      { server web:5000;       keepalive 16; }
    upstream livekit_upstream  { server livekit:7880;   keepalive 8; }
    upstream proctor2_upstream { server proctor2:5300;  keepalive 16; }
    upstream minio_upstream    { server minio:9000;     keepalive 8; }

    server {
        listen 80 default_server;
        server_name _;

        # Default landing → app
        location = / {
            return 302 /OnlineJudge/;
        }

        # ---- Flask app + SSE ---------------------------------------
        location /OnlineJudge/ {
            proxy_pass         http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  http;
            proxy_set_header   Connection         $connection_upgrade;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_buffering    off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # ---- LiveKit signaling -------------------------------------
        location /livekit/ {
            rewrite ^/livekit/(.*)$ /$1 break;
            proxy_pass         http://livekit_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   Connection         $connection_upgrade;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering    off;
        }
        location = /livekit { return 302 /livekit/; }

        # ---- proctor2 chunk upload + admin internal ----------------
        location /proctor2/internal/ {
            # Lock down the internal API on dev too — the web container
            # talks to proctor2 directly via the docker DNS name, not
            # via the gateway.
            return 403;
        }
        location /proctor2/ {
            rewrite ^/proctor2/(.*)$ /$1 break;
            proxy_pass         http://proctor2_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            client_max_body_size 32m;
            proxy_request_buffering off;
            proxy_read_timeout 5m;
        }

        # ---- S3 path-style ----------------------------------------
        location /s3/ {
            limit_except GET HEAD OPTIONS { deny all; }
            rewrite ^/s3/(.*)$ /$1 break;
            proxy_pass         http://minio_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_buffering    off;
            proxy_set_header   Range              $http_range;
            proxy_set_header   If-Range           $http_if_range;
        }
    }
}
