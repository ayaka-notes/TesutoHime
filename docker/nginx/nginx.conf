# TesutoHime production gateway.
#
# One public TLS port (443) serves everything HTTP / WebSocket:
#   - /OnlineJudge/             → web        (Flask app)
#   - /livekit/                 → livekit    (SFU signaling, WSS)
#   - /proctor2/                → proctor2   (chunk upload + admin internal)
#   - /s3/<bucket>/<key>        → minio      (S3 path-style, public reads)
#
# Two extra ports stay direct because they are NOT HTTP and cannot be
# tunneled through an HTTPS reverse proxy in a sane way:
#   - 7881/tcp           LiveKit TCP media fallback (raw TCP)
#   - 50000-50999/udp    LiveKit UDP media (the primary realtime path)
#
# Plain HTTP on :80 only exists to redirect → HTTPS. No traffic served.
#
# TLS: certs are expected at /etc/nginx/certs/fullchain.pem and
# privkey.pem (Let's Encrypt / cert-manager). Run with the included
# bind mount in docker-compose.prod.yml.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" rt=$request_time ut=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  75;
    keepalive_requests 1000;
    server_tokens   off;

    # Big enough for IDE source uploads / problem-data zips
    # without spilling chunks to disk in the common case.
    client_max_body_size 256m;
    client_body_buffer_size 1m;

    # WebSocket upgrade map — used by every block that proxies WS.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Gzip text payloads; do not double-compress media or already
    # compressed S3 blobs.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        application/wasm
        image/svg+xml;

    # ----- upstreams ---------------------------------------------------
    upstream web_upstream      { server web:5000;       keepalive 32; }
    upstream livekit_upstream  { server livekit:7880;   keepalive 16; }
    upstream proctor2_upstream { server proctor2:5300;  keepalive 32; }
    upstream minio_upstream    { server minio:9000;     keepalive 16; }

    # ----- :80 → :443 redirect ----------------------------------------
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;
        # ACME http-01 challenge (cert-manager / certbot writes here).
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----- :443 main gateway ------------------------------------------
    server {
        listen      443 ssl http2 default_server;
        listen      [::]:443 ssl http2 default_server;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # HSTS — opt in after you confirm everything is HTTPS-clean.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Security headers safe for the whole gateway.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options       "SAMEORIGIN" always;
        add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

        # ---- root: send to web app -----------------------------------
        location = / {
            return 302 /OnlineJudge/;
        }

        # ---- Flask app (default catch-all) ---------------------------
        location /OnlineJudge/ {
            proxy_pass         http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Upgrade           $http_upgrade;
            # SSE endpoints stream for minutes; disable buffering.
            proxy_buffering    off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # ---- LiveKit signaling (WSS) ---------------------------------
        # Client URL: wss://<host>/livekit
        # LiveKit expects to see /rtc and /twirp at its root, so we
        # rewrite away the /livekit prefix.
        location /livekit/ {
            rewrite ^/livekit/(.*)$ /$1 break;
            proxy_pass         http://livekit_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering    off;
        }
        location = /livekit {
            return 302 /livekit/;
        }

        # ---- proctor2 chunk + internal API ---------------------------
        # Browser PUBLIC_URL: https://<host>/proctor2
        # Internal web→proctor2 calls still go in-cluster via
        # http://proctor2:5300, so we restrict the /internal/ path here
        # to localhost only — leak-resistant if someone discovers it.
        location /proctor2/internal/ {
            allow 127.0.0.1;
            allow ::1;
            deny  all;
        }
        location /proctor2/ {
            rewrite ^/proctor2/(.*)$ /$1 break;
            proxy_pass         http://proctor2_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            # MediaRecorder chunks: bigger than default POST buffer.
            client_max_body_size 32m;
            proxy_request_buffering off;
            proxy_read_timeout 5m;
        }

        # ---- S3 (MinIO) public read path -----------------------------
        # Path-style: https://<host>/s3/<bucket>/<key>
        # Only GET / HEAD on the public bucket; the web app uses the
        # internal endpoint for presigned PUTs.
        location /s3/ {
            limit_except GET HEAD OPTIONS { deny all; }
            rewrite ^/s3/(.*)$ /$1 break;
            proxy_pass         http://minio_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_buffering    off;
            # Range requests must pass through for video scrubbing.
            proxy_set_header   Range             $http_range;
            proxy_set_header   If-Range          $http_if_range;
        }

        # ---- ACME http-01 (in case 80 isn't open) --------------------
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }
    }
}
